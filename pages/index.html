<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitLab Valet</title>
  <meta name="description" content="Your personal multi-instance GitLab agent.">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: 'GitLab Valet',
      repo: 'ckodex/gitlabvalet',
      loadSidebar: true,
      subMaxLevel: 2,
      homepage: 'README.md',
      basePath: 'docs/',
      auto2top: true,
      themeColor: '#6C47D2',
      search: {
        placeholder: 'Search',
        noData: 'No results.',
      },
    };
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
</body>
</html>
