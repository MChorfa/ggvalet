version: 2
project_name: ggvalet

# Pin the SCM to GitHub. Without this, a GITLAB_TOKEN leaked into the
# environment makes GoReleaser auto-detect GitLab and 401 against
# gitlab.com on publish. Declaring GITHUB_TOKEN here fails fast if the
# token is missing and prevents the GitLab token from being picked up.
env:
  - GITHUB_TOKEN={{ .Env.GITHUB_TOKEN }}

before:
  hooks:
    - go mod tidy
    - syft dir:. -o cyclonedx-json=sbom.cdx.json

builds:
  - id: ggvalet
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X main.version={{.Version}}
    main: .

archives:
  - id: ggvalet
    formats:
      - tar.gz
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}'
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: SHA256SUMS
  algorithm: sha256
  extra_files:
    - glob: ./sbom.cdx.json

sboms:
  - id: archive
    artifacts: archive
  - id: source
    artifacts: source

signs:
  - id: checksum
    cmd: cosign
    certificate: '${artifact}.pem'
    args:
      - sign-blob
      - --yes
      - --output-certificate=${certificate}
      - --output-signature=${signature}
      - ${artifact}
    artifacts: checksum
    output: true

snapshot:
  version_template: '{{ incpatch .Version }}-next'

changelog:
  use: git
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'

release:
  github:
    owner: MChorfa
    name: ggvalet
  extra_files:
    - glob: ./sbom.cdx.json
  include_meta: true
