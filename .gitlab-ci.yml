# GitLab Valet CI — GA evidence gates (CKODEX DoD² + VWP §26).
# Every stage maps to a release-blocking gate; CI fails closed.
stages: [verify, test, security, governance, build, release]

variables:
  GOFLAGS: "-mod=mod"
  GO_IMAGE: "golang:1.24"          # matches go.mod's declared minimum (go 1.24)
  MIN_COVERAGE: "80"               # CLAUDE.md §4 min_test_coverage

# ── verify: format, vet, build ─────────────────────────────────────────────
verify:
  stage: verify
  image: $GO_IMAGE
  script:
    - gofmt -l . | tee /tmp/fmt.out; test ! -s /tmp/fmt.out
    - go vet ./...
    - go build ./...

# ── test: full suite + 80% coverage gate (P-VW-005) ────────────────────────
# The httptest loopback packages (client, provider/gitlab, provider/github) bind
# 127.0.0.1 — available in this container, unlike the dev sandbox — so the full
# suite runs green here. This is the canonical evidence source for "tests pass".
test:
  stage: test
  image: $GO_IMAGE
  script:
    - go test ./... -coverprofile=cover.out -covermode=atomic
    - go tool cover -func=cover.out | tee coverage.txt
    - |
      total=$(awk '/^total:/ {gsub("%","",$3); print $3}' coverage.txt)
      echo "total coverage: ${total}% (gate: ${MIN_COVERAGE}%)"
      awk -v t="$total" -v g="$MIN_COVERAGE" 'BEGIN { exit !(t+0 >= g+0) }' \
        || { echo "FAIL: coverage ${total}% < ${MIN_COVERAGE}% gate"; exit 1; }
  coverage: '/total:\s+\(statements\)\s+\d+\.\d+%/'
  artifacts:
    paths: [cover.out, coverage.txt]
    expire_in: 30 days

# ── test: dependency resolution + tidy drift (P-VW-008) ────────────────────
deps:
  stage: test
  image: $GO_IMAGE
  script:
    - go mod verify
    - go mod download
    - cp go.mod go.mod.orig && cp go.sum go.sum.orig
    - go mod tidy
    - 'diff go.mod go.mod.orig && diff go.sum go.sum.orig || { echo "FAIL: go.mod/go.sum not tidy - run go mod tidy"; exit 1; }'

# ── security: vulnerabilities, secrets, SBOM ───────────────────────────────
vuln:
  stage: security
  image: $GO_IMAGE
  script:
    - go install golang.org/x/vuln/cmd/govulncheck@latest
    - $(go env GOPATH)/bin/govulncheck ./...

secrets:
  stage: security
  image:
    name: zricethezav/gitleaks:latest
    entrypoint: [""]
  script:
    - gitleaks detect --no-banner --redact --source .

sbom:
  stage: security
  image:
    name: anchore/syft:latest
    entrypoint: [""]
  script:
    - syft dir:. -o cyclonedx-json=sbom.cdx.json
  artifacts:
    paths: [sbom.cdx.json]
    expire_in: 30 days

# ── governance: VWP §26 gate (hedge / marketing / unsurfaced-stub) ─────────
vwp:
  stage: governance
  image: $GO_IMAGE
  script:
    - bash scripts/vwp-lint.sh

# ── build: cross-compile distributable binaries ────────────────────────────
build:
  stage: build
  image: $GO_IMAGE
  script:
    - make cross
  artifacts:
    paths: [dist/]
    expire_in: 1 week

# ── release: tag-driven signed artifacts + SBOM via GoReleaser (closes DEF-02) ─
# Cosign keyless signing via GitLab OIDC (SIGSTORE_ID_TOKEN). GoReleaser builds,
# packages, signs, and publishes the release to the GitLab package registry.
release:
  stage: release
  image: $GO_IMAGE
  id_tokens:
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  rules:
    - if: '$CI_COMMIT_TAG'
  variables:
    GIT_DEPTH: 0
    GITLAB_TOKEN: $CI_JOB_TOKEN
  script:
    - apt-get update && apt-get install -y --no-install-recommends curl ca-certificates git
    - curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
    - curl -sSfL -o /usr/local/bin/cosign https://github.com/sigstore/cosign/releases/latest/download/cosign-linux-amd64
    - chmod +x /usr/local/bin/cosign
    - curl -sSfL https://github.com/goreleaser/goreleaser/releases/latest/download/goreleaser_Linux_x86_64.tar.gz | tar -xz -C /tmp && install /tmp/goreleaser /usr/local/bin/goreleaser
    - goreleaser release --clean --config .goreleaser.gitlab.yml
  artifacts:
    paths: [dist/]
    expire_in: never

# ── pages: documentation + release artifact index (GitLab Pages) ─────────────
pages:
  stage: release
  image: python:3.12-slim
  needs:
    - job: release
      artifacts: true
      optional: true
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - |
      BASE="${CI_SERVER_URL}/${CI_PROJECT_PATH}/-/releases/download/${CI_COMMIT_TAG}/"
      bash scripts/build-site.sh \
        --metadata dist/metadata.json \
        --artifacts dist/artifacts.json \
        --version "${CI_COMMIT_TAG:-latest}" \
        --release-base-url "${CI_COMMIT_TAG:+${BASE}}" \
        --output public
  artifacts:
    paths: [public]

